# Fast PHP-only checks (no compressor apt install). Runner: tests/run_php_smokes.sh — phase 1 syntax (php -l), phase 2 undeep + census + peel-first FZHM smokes + run_benchmarks JSON verify, then substring regressions through web-fs smokes; optional disk sidecar assert after the script.
# benchmark-guards.yml also runs undeep after apt (workflow_dispatch / guard-only PRs).
name: php-smokes

permissions:
  contents: read

concurrency:
  group: php-smokes-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

