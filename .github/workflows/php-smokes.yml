jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pcntl, sqlite3, mbstring

      - name: PHP smokes (tests/run_php_smokes.sh)
        run: bash tests/run_php_smokes.sh

      - name: Web extract parity gate (library + PHP; tools optional on runner)
        run: bash scripts/fzc_parity_gate.sh --library-only

      - name: Inner disk-cache chain/pieces sidecar roundtrip (synthetic)
        run: FZ_INNER_DISK_SIDECAR_ROUNDTRIP_ASSERT=1 php tests/case23_disk_sidecar_roundtrip_smoke.php
